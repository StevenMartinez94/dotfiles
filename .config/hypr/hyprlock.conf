source = ~/.config/hypr/colors/matugen.conf

$font = Monospace
$clock_font = Geist Mono ExtraBold 
general {
    hide_cursor = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = $inverse_on_surface

    outer_color = $primary 45deg
    check_color = $secondary 120deg
    fail_color = $error 40deg

    font_color = $outline
    fade_on_empty = true
    rounding = 100

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -380
    halign = center
    valign = center
}

# TIME (HOURS)
label {
    monitor =
    text = cmd[update:60000] date +"%H"
    font_size = 175
    font_family = $clock_font

    position = 0, -290
    halign = center
    valign = top
    color = $primary
}

# TIME (MINUTES)
label {
    monitor =
    text = cmd[update:60000] date +"%M"
    font_size = 175
    font_family = $clock_font

    position = 0, -490
    halign = center
    valign = top
    color = $on_surface
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%a, %B %d" # update every 60 seconds
    font_size = 20
    font_family = $font

    position = 120, -150
    halign = left
    valign = top
    color = $on_surface
}

